name: 🚀 CI/CD Pipeline - MAY17

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Run Tests
  # ─────────────────────────────────────────
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ✅ Run Tests with Coverage
        run: npm test
        env:
          NODE_ENV: test

      - name: 📊 Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: matrix.node-version == '20.x'
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────
  # JOB 2: Lint Check
  # ─────────────────────────────────────────
  lint:
    name: 🔍 Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Run ESLint
        run: npm run lint || echo "⚠️ Lint warnings found, continuing..."

  # ─────────────────────────────────────────
  # JOB 3: Build
  # ─────────────────────────────────────────
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --omit=dev

      - name: 🏗️ Run Build
        run: npm run build

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            src/
            package.json
            package-lock.json
          retention-days: 7

  # ─────────────────────────────────────────
  # JOB 4: Deploy (only on push to main)
  # ─────────────────────────────────────────
  deploy:
    name: 🚢 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: 📦 Install Production Dependencies
        run: npm ci --omit=dev

      - name: 🚀 Deploy
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 Deploying MAY17 to production..."
          echo "📌 Branch  : ${{ github.ref_name }}"
          echo "📝 Commit  : ${{ github.sha }}"
          echo "👤 Author  : ${{ github.actor }}"
          echo "🕐 Time    : $(date)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment complete!"
          # 👇 Replace this with your actual deploy command:
          # e.g., SSH to server, deploy to Vercel, Railway, Render, etc.

      - name: 🎉 Notify Success
        run: echo "✅ MAY17 deployed successfully from commit ${{ github.sha }}"
